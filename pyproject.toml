[project]
name = "chorus"
version = "0.1.0"
description = "Agent-native podcast curation + voice"
requires-python = ">=3.12"
# Ranges live in requirements.in; exact pins (what Vercel/CI install) are
# compiled into requirements.txt with `uv pip compile requirements.in`.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "anthropic>=0.40,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
