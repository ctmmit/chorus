[project]
name = "chorus"
version = "0.1.0"
description = "Agent-native podcast curation + voice"
requires-python = ">=3.12"
# Ranges live in requirements.in; exact pins (what Vercel/CI install) are
# compiled into requirements.txt with `uv pip compile requirements.in`.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "anthropic>=0.40,<1",
  "python-dotenv>=1.0,<2",
  # Phase B (Vercel port): Postgres store/cache + Inngest durable-step runner.
  "psycopg[binary]>=3.2,<4",
  "psycopg_pool>=3.2,<4",
  "inngest>=0.4,<1",
  # Phase D: MCP server for agent callers.
  "mcp>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Explicit rule set so lint results don't change when ruff's defaults do
# (CI installs the pinned ruff from requirements-dev.txt).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE", "DTZ", "FLY", "PYI"]

[tool.ruff.lint.per-file-ignores]
# Live scripts call chorus.config.load_env() before importing the package so
# provider selection sees .env.local; that ordering is the point.
"scripts/*.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection idiom: `param: T = Depends(fn)` is by design.
extend-immutable-calls = ["fastapi.Depends"]

# Read by Vercel's Python runtime (vercel.com/docs/frameworks/backend/fastapi)
# to find the ASGI app object without guessing at file layout.
[tool.vercel]
entrypoint = "chorus.app:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
