name: ci

on:
  pull_request:
  push:
    branches: [master, main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The full fixture transcripts live in the private repo (see
      # fixtures/README.md). Without them the real-fixture tests skip and
      # the public synthetic sample still exercises the whole spine.
      - name: Fetch private fixtures (optional)
        if: ${{ secrets.PRIVATE_FIXTURES_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_FIXTURES_TOKEN }}
        run: |
          gh repo clone ctmmit/chorus-private /tmp/chorus-private -- --depth 1
          cp /tmp/chorus-private/fixtures/transcripts/*.json fixtures/transcripts/

      - name: Lint
        run: ruff check chorus tests scripts

      - name: Types
        run: mypy chorus

      - name: Tests
        run: pytest -q

      # The golden path drives the five real show transcripts, so it only runs
      # when the private fixtures were fetched above.
      - name: Golden path
        if: ${{ secrets.PRIVATE_FIXTURES_TOKEN != '' }}
        run: python scripts/golden_path.py
