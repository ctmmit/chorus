name: ci

on:
  pull_request:
  push:
    branches: [master, main, staging]

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # The secrets context is not usable in a step `if`; expose it as env.
      PRIVATE_FIXTURES_TOKEN: ${{ secrets.PRIVATE_FIXTURES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      # The README tells agents to launch `chorus-mcp` by absolute path from
      # any directory; prove the package and both commands resolve outside
      # the checkout.
      - name: Package install smoke
        working-directory: /tmp
        run: |
          python -c "import chorus.mcp_server, chorus.app"
          command -v chorus-mcp
          command -v chorus-api

      # The full fixture transcripts live in the private repo (see
      # fixtures/README.md). Without them the real-fixture tests skip and
      # the public synthetic sample still exercises the whole spine.
      - name: Fetch private fixtures (optional)
        if: ${{ env.PRIVATE_FIXTURES_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.PRIVATE_FIXTURES_TOKEN }}
        run: |
          gh repo clone ctmmit/chorus-private /tmp/chorus-private -- --depth 1
          cp /tmp/chorus-private/fixtures/transcripts/*.json fixtures/transcripts/

      - name: Lint
        run: ruff check chorus tests scripts

      - name: Types
        run: mypy chorus

      - name: Tests
        run: pytest -q

      # The golden path drives the five real show transcripts, so it only runs
      # when the private fixtures were fetched above.
      - name: Golden path
        if: ${{ env.PRIVATE_FIXTURES_TOKEN != '' }}
        run: python scripts/golden_path.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test -- --run

      # Mock mode is the committed default (web/.env), so the build needs no API.
      - name: Build
        run: npm run build
